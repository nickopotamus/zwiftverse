url: https://nickopotamus.github.io/zwiftverse/

template:
  bootstrap: 5

reference:
- title: Zwift game API
  desc: OAuth2-authenticated access to profiles, activities, events and worlds.
  contents:
  - zwift_auth
  - zwift_get
  - zwift_status
- title: ZwiftPower
  desc: Session-cookie access to results, teams, leagues and segment data.
  contents:
  - zp_session
  - zp_set_cookie
  - zp_login
  - zp_get
  - zp_unflag
  - zp_analysis
  - zp_power_curve
- title: ZwiftRacing.app
  desc: Key-authenticated rider ratings, results and club rosters.
  contents:
  - zr_client
  - zr_get
- title: Across APIs
  desc: Helpers that combine ZwiftRacing.app and ZwiftPower data.
  contents:
  - zv_rider_cp
  - zv_signups_cp
- title: Caching
  desc: On-disk TTL cache controls.
  contents:
  - starts_with("zv_cache")

articles:
- title: Guides
  navbar: ~
  contents:
  - race-analysis
  - climb-prediction
